services:
  api:

    build:
      context: .
    ports:
      - "8080-8080"
    environment:
      SRPING_DATASOURCE_URL: jdbc://db:men:voitures
      SRPING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SRPING_DATASOURCE_PASSWORD: ${POSTGRES_PWD}

  db:
    image: postgres
    restart: always
    environment:
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: example
       POSTGRES_DB: voitures
    ports:
      - "5432-5432"
    volumes:
      - pg_data:/etc/db



volumes:
  - pg_data: